<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Telegram Bot (Lưu tự động & Gửi nhanh)</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 25px 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 420px;
        }
        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        h2 {
            margin: 0;
            color: #333;
            font-size: 20px;
        }
        .btn-clear {
            background: #e0e0e0;
            border: none;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            color: #333;
        }
        .btn-clear:hover {
            background: #d0d0d0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
            font-size: 14px;
        }
        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        textarea {
            resize: vertical;
            height: 80px;
        }
        .note {
            font-size: 12px;
            color: #666;
            margin-top: 4px;
            font-style: italic;
        }
        .btn-send {
            width: 100%;
            padding: 11px;
            background-color: #0088cc;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .btn-send:hover {
            background-color: #006699;
        }
        #result {
            margin-top: 15px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
            display: none;
            font-size: 14px;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-flex">
        <h2>Test Telegram Bot</h2>
        <button class="btn-clear" onclick="clearStorage()" title="Xóa dữ liệu đã lưu">Xóa bộ nhớ</button>
    </div>
    
    <!-- Ô nhập Bot Token -->
    <div class="form-group">
        <label for="botToken">Bot Token:</label>
        <input type="text" id="botToken" placeholder="Ví dụ: 123456789:ABCdefGhIJKlmNoPQRsTUVwxyZ" oninput="saveData()">
    </div>

    <!-- Chọn loại gửi: Cá nhân hay Nhóm -->
    <div class="form-group">
        <label for="chatType">Gửi tới:</label>
        <select id="chatType" onchange="toggleChatIdLabel(); saveData();">
            <option value="private">Chat Cá Nhân (User ID)</option>
            <option value="group">Nhóm / Channel (Group ID)</option>
        </select>
    </div>

    <!-- Ô nhập Chat ID / Group ID -->
    <div class="form-group">
        <label id="chatIdLabel" for="chatId">Chat ID (Cá nhân):</label>
        <input type="text" id="chatId" placeholder="Nhập ID cá nhân của bạn" oninput="saveData()">
        <div id="chatIdNote" class="note">Mẹo: Chat ID nhóm thường bắt đầu bằng dấu trừ (ví dụ: -100xxxxxxxxxx).</div>
    </div>

    <!-- Ô nhập nội dung tin nhắn -->
    <div class="form-group">
        <label for="message">Nội dung tin nhắn: <span style="font-weight: normal; font-size: 11px; color: #888;">(Bấm Ctrl + Enter để gửi nhanh)</span></label>
        <textarea id="message" placeholder="Nhập nội dung..." onkeydown="handleKeyPress(event)">Xin chào, test gửi tin nhắn nhanh!</textarea>
    </div>

    <button class="btn-send" onclick="sendTelegramMessage()">Gửi Tin Nhắn</button>

    <div id="result"></div>
</div>

<script>
    // Khi trang vừa tải xong, tự động load dữ liệu đã lưu trước đó
    window.onload = function() {
        if (localStorage.getItem('tg_botToken')) {
            document.getElementById('botToken').value = localStorage.getItem('tg_botToken');
        }
        if (localStorage.getItem('tg_chatType')) {
            document.getElementById('chatType').value = localStorage.getItem('tg_chatType');
        }
        if (localStorage.getItem('tg_chatId')) {
            document.getElementById('chatId').value = localStorage.getItem('tg_chatId');
        }
        toggleChatIdLabel();
    };

    // Lưu dữ liệu vào localStorage mỗi khi người dùng gõ
    function saveData() {
        localStorage.setItem('tg_botToken', document.getElementById('botToken').value.trim());
        localStorage.setItem('tg_chatType', document.getElementById('chatType').value);
        localStorage.setItem('tg_chatId', document.getElementById('chatId').value.trim());
    }

    // Xóa bộ nhớ lưu trữ
    function clearStorage() {
        if (confirm("Bạn có chắc muốn xóa Bot Token và Chat ID đã lưu không?")) {
            localStorage.clear();
            document.getElementById('botToken').value = '';
            document.getElementById('chatId').value = '';
            document.getElementById('chatType').value = 'private';
            toggleChatIdLabel();
            showResult("Đã xóa sạch bộ nhớ lưu trữ!", "success");
        }
    }

    // Gửi nhanh bằng phím tắt Ctrl + Enter trong ô soạn thảo
    function handleKeyPress(event) {
        if (event.ctrlKey && event.key === 'Enter') {
            sendTelegramMessage();
        }
    }

    // Thay đổi nhãn hướng dẫn tùy theo lựa chọn Cá nhân hay Nhóm
    function toggleChatIdLabel() {
        const chatType = document.getElementById('chatType').value;
        const chatIdLabel = document.getElementById('chatIdLabel');
        const chatIdInput = document.getElementById('chatId');

        if (chatType === 'group') {
            chatIdLabel.innerText = "Group / Channel ID:";
            chatIdInput.placeholder = "Ví dụ: -1001234567890";
        } else {
            chatIdLabel.innerText = "Chat ID (Cá nhân):";
            chatIdInput.placeholder = "Nhập ID cá nhân của bạn";
        }
    }

    // Hàm gửi tin nhắn Telegram
    function sendTelegramMessage() {
        const token = document.getElementById('botToken').value.trim();
        const chatId = document.getElementById('chatId').value.trim();
        const text = document.getElementById('message').value.trim();
        const resultDiv = document.getElementById('result');

        // Lưu lại dữ liệu lúc bấm gửi cho chắc chắn
        saveData();

        // Kiểm tra dữ liệu đầu vào
        if (!token) {
            showResult("Vui lòng nhập Bot Token!", "error");
            return;
        }
        if (!chatId) {
            showResult("Vui lòng nhập Chat ID hoặc Group ID!", "error");
            return;
        }
        if (!text) {
            showResult("Vui lòng nhập nội dung tin nhắn!", "error");
            return;
        }

        const url = `https://api.telegram.org/bot${token}/sendMessage`;
        const data = {
            chat_id: chatId,
            text: text
        };

        resultDiv.style.display = "block";
        resultDiv.className = "";
        resultDiv.innerHTML = "Đang gửi...";

        fetch(url, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        })
        .then(response => response.json())
        .then(data => {
            if (data.ok) {
                showResult("Gửi tin nhắn thành công!", "success");
            } else {
                showResult("Lỗi từ Telegram: " + data.description, "error");
            }
        })
        .catch(error => {
            showResult("Lỗi kết nối mạng: " + error.message, "error");
        });
    }

    function showResult(message, type) {
        const resultDiv = document.getElementById('result');
        resultDiv.style.display = "block";
        resultDiv.className = type;
        resultDiv.innerText = message;
    }
</script>

</body>
</html>
